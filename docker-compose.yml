version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexamart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nexamart}
      POSTGRES_USER: ${DB_USER:-nexamart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nexamart}
    ports:
      - "5432:5432"
    volumes:
      - nexamart-pgdata:/var/lib/postgresql/data

volumes:
  nexamart-pgdata:
