spring:
  application:
    name: nexamart-backend
  profiles:
    active: dev
  jackson:
    default-property-inclusion: non_null

server:
  port: 8081

nexamart:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-me-please-32chars-min}
    expiration-ms: 86400000
  ai:
    openai-api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4o-mini}
    base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:file:./data/nexamart;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

---
spring:
  config:
    activate:
      on-profile: docker
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexamart}
    username: ${DB_USER:nexamart}
    password: ${DB_PASSWORD:nexamart}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
